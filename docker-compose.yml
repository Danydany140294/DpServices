

services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dp_php
    volumes:
      - .:/var/www/html:cached
    depends_on:
      - postgres
      - redis
    networks:
      - dp_network

  nginx:
    image: nginx:alpine
    container_name: dp_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - dp_network

  postgres:
    image: postgres:16-alpine
    container_name: dp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dp_services
      POSTGRES_USER: dp_user
      POSTGRES_PASSWORD: dp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dp_network

  redis:
    image: redis:7-alpine
    container_name: dp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - dp_network

  mailpit:
    image: axllent/mailpit
    container_name: dp_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - dp_network

volumes:
  postgres_data:

networks:
  dp_network:
    driver: bridge